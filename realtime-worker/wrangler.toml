# =============================================================================
# wrangler.toml — WORKER REALTIME (chat, ai đang online)
# Deploy:  cd realtime-worker && npx wrangler deploy
# Chạy local: npm run realtime (ở thư mục gốc)
# =============================================================================
name = "ielts-realtime"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Không mở địa chỉ *.workers.dev: chỉ trang web (Pages) gọi tới được qua binding
workers_dev = false

[[durable_objects.bindings]]
name = "FAMILY_HUB"
class_name = "FamilyHub"

# Durable Object dùng bộ nhớ SQLite (miễn phí)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyHub"]

# Dùng chung database với trang web
[[d1_databases]]
binding = "DB"
database_name = "ielts-db"
database_id = "d4017116-8fbd-48a9-aac5-6e3007ceb85b"
