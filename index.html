<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>IELTS Nhà Mình</title>
    <!--
      Icon = đầu cún Ki (nhóm Blender render, public/mascot/head/). Không khai báo favicon.svg nữa
      vì trình duyệt ưu tiên SVG hơn PNG (file vẫn giữ trong public/ làm dự phòng).
      apple-touch-icon + icon-maskable-512 có nền kem: tạo bằng `node scripts/generate-app-icons.mjs`.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/mascot/head/head-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/mascot/head/head-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/mascot/head/head-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- màu thanh trình duyệt trên điện thoại = màu nền trang (--c-bg sáng / tối trong tokens.css) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff8ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1330" />
    <!--
      Chống "nháy trắng" khi dùng chế độ tối: đặt data-theme lên <html> NGAY khi
      trang bắt đầu tải (trước khi React chạy). Khoá 'ielts-theme' phải khớp với
      src/design-system/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('ielts-theme')
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <!--
      Font (đều có tiếng Việt — Google Fonts tự gửi phần chữ Việt qua unicode-range):
        Baloo 2        : tiêu đề, số lớn, nút (tròn, dày, vui)
        Be Vietnam Pro : giao diện
        Source Serif 4 : bài đọc dài
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
